<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muchiri's Admin Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="admin-styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- LOGIN BOX -->
      <div id="loginBox" class="login-box">
        <i
          class="fas fa-shield-alt"
          style="font-size: 3rem; color: #b45f2b"
        ></i>
        <h2 style="margin: 15px 0">Admin Login</h2>
        <input type="password" id="password" placeholder="Enter Password" />
        <button onclick="login()">Login</button>
        <p id="errorMsg" class="error-msg"></p>
        <p style="margin-top: 15px">
          <a href="index.html" style="color: #b45f2b">← Back to Store</a>
        </p>
      </div>

      <!-- DASHBOARD (shown after login) -->
      <div id="dashboard" class="dashboard">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
          "
        >
          <h2><i class="fas fa-chart-line"></i> Muchiri's Admin Dashboard</h2>
          <div>
            <a href="index.html" class="back-link" style="margin-right: 15px"
              ><i class="fas fa-store"></i> Back to Store</a
            >
            <button onclick="logout()" style="width: auto; background: gray">
              Logout
            </button>
          </div>
        </div>

        <!-- STATS CARDS -->
        <div class="stats-grid">
          <div class="stat-card">
            <h3 id="totalRevenue">KSh 0</h3>
            <p>💰 Total Revenue</p>
          </div>
          <div class="stat-card">
            <h3 id="totalOrders">0</h3>
            <p>📦 Total Orders</p>
          </div>
          <div class="stat-card">
            <h3 id="totalMessages">0</h3>
            <p>📩 Messages</p>
          </div>
          <div class="stat-card">
            <h3 id="totalBookings">0</h3>
            <p>📅 Bookings</p>
          </div>
        </div>

        <!-- TABS -->
        <div class="tab-buttons">
          <button class="tab-btn active" onclick="showTab('orders')">
            📦 Orders
          </button>
          <button class="tab-btn" onclick="showTab('contacts')">
            📩 Contact Messages
          </button>
          <button class="tab-btn" onclick="showTab('bookings')">
            📅 Bookings
          </button>
        </div>

        <!-- ORDERS TAB -->
        <div id="ordersTab" class="tab-content active">
          <h3>Customer Orders</h3>
          <div id="ordersList"></div>
        </div>

        <!-- CONTACTS TAB -->
        <div id="contactsTab" class="tab-content">
          <h3>Contact Messages</h3>
          <div id="contactsList"></div>
        </div>

        <!-- BOOKINGS TAB -->
        <div id="bookingsTab" class="tab-content">
          <h3>Styling Bookings</h3>
          <div id="bookingsList"></div>
        </div>
      </div>
    </div>

    <script src="admin-script.js"></script>
  </body>
</html>
