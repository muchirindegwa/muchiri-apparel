<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muchiri's Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #fef9e6; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .login-box, .dashboard { background: white; padding: 30px; border-radius: 20px; max-width: 400px; margin: 100px auto; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .dashboard { max-width: 1200px; margin: 0 auto; display: none; }
    input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #ddd; }
    button { background: #b45f2b; color: white; border: none; padding: 12px 24px; border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; text-align: center; border-radius: 15px; border: 1px solid #f0e2ce; }
    .stat-card h3 { font-size: 2rem; color: #b45f2b; }
    .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; margin-top: 20px; }
    .data-table th, .data-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    .data-table th { background: #b45f2b; color: white; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { background: #ddd; color: #333; width: auto; padding: 10px 20px; border-radius: 30px; cursor: pointer; }
    .tab-btn.active { background: #b45f2b; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .error-msg { color: red; margin-top: 10px; }
    .back-link { display: inline-block; margin-bottom: 20px; color: #b45f2b; text-decoration: none; font-weight: bold; }
    .back-link:hover { text-decoration: underline; }
    h2 { margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="container">
  <!-- LOGIN BOX -->
  <div id="loginBox" class="login-box">
    <i class="fas fa-shield-alt" style="font-size: 3rem; color: #b45f2b;"></i>
    <h2 style="margin: 15px 0;">Admin Login</h2>
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
    <p id="errorMsg" class="error-msg"></p>
    <p style="margin-top: 15px;"><a href="index.html" style="color: #b45f2b;">← Back to Store</a></p>
  </div>

  <!-- DASHBOARD (shown after login) -->
  <div id="dashboard" class="dashboard">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
      <h2><i class="fas fa-chart-line"></i> Muchiri's Admin Dashboard</h2>
      <div>
        <a href="index.html" class="back-link" style="margin-right: 15px;"><i class="fas fa-store"></i> Back to Store</a>
        <button onclick="logout()" style="width: auto; background: gray;">Logout</button>
      </div>
    </div>
    
    <!-- STATS CARDS -->
    <div class="stats-grid">
      <div class="stat-card"><h3 id="totalRevenue">KSh 0</h3><p>💰 Total Revenue</p></div>
      <div class="stat-card"><h3 id="totalOrders">0</h3><p>📦 Total Orders</p></div>
      <div class="stat-card"><h3 id="totalMessages">0</h3><p>📩 Messages</p></div>
      <div class="stat-card"><h3 id="totalBookings">0</h3><p>📅 Bookings</p></div>
    </div>
    
    <!-- TABS -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="showTab('orders')">📦 Orders</button>
      <button class="tab-btn" onclick="showTab('contacts')">📩 Contact Messages</button>
      <button class="tab-btn" onclick="showTab('bookings')">📅 Bookings</button>
    </div>
    
    <!-- ORDERS TAB -->
    <div id="ordersTab" class="tab-content active">
      <h3>Customer Orders</h3>
      <div id="ordersList"></div>
    </div>
    
    <!-- CONTACTS TAB -->
    <div id="contactsTab" class="tab-content">
      <h3>Contact Messages</h3>
      <div id="contactsList"></div>
    </div>
    
    <!-- BOOKINGS TAB -->
    <div id="bookingsTab" class="tab-content">
      <h3>Styling Bookings</h3>
      <div id="bookingsList"></div>
    </div>
  </div>
</div>

<script>
// ==============================================
// 🔐 YOUR ADMIN PASSWORD - CHANGE THIS!
// ==============================================
const ADMIN_PASSWORD = "muchiri2025";

function login() {
  const password = document.getElementById('password').value;
  if (password === ADMIN_PASSWORD) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  } else {
    document.getElementById('errorMsg').innerText = 'Wrong password!';
  }
}

function logout() {
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('password').value = '';
  document.getElementById('errorMsg').innerText = '';
}

function loadDashboard() {
  // Get data from localStorage (same data from the store)
  const orders = JSON.parse(localStorage.getItem('muchiri_orders') || '[]');
  const contacts = JSON.parse(localStorage.getItem('muchiri_contacts') || '[]');
  const bookings = JSON.parse(localStorage.getItem('muchiri_bookings') || '[]');
  
  // Calculate total revenue
  let totalRevenue = 0;
  orders.forEach(order => { totalRevenue += order.total; });
  
  // Update stats cards
  document.getElementById('totalRevenue').innerText = `KSh ${totalRevenue.toLocaleString()}`;
  document.getElementById('totalOrders').innerText = orders.length;
  document.getElementById('totalMessages').innerText = contacts.length;
  document.getElementById('totalBookings').innerText = bookings.length;
  
  // Build orders table
  let ordersHtml = '<table class="data-table">';
  ordersHtml += '<tr><th>Order ID</th><th>Phone Number</th><th>Total (KSh)</th><th>Items</th><th>Date</th></tr>';
  if (orders.length === 0) {
    ordersHtml += '<tr><td colspan="5" style="text-align:center;">No orders yet</td></tr>';
  } else {
    orders.forEach(order => {
      ordersHtml += `<tr>
        <td>${order.id}</td>
        <td>${order.phone}</td>
        <td><strong>KSh ${order.total.toLocaleString()}</strong></td>
        <td>${order.items || 'View in WhatsApp'}</td>
        <td>${order.date}</td>
      </tr>`;
    });
  }
  ordersHtml += '</table>';
  document.getElementById('ordersList').innerHTML = ordersHtml;
  
  // Build contacts table
  let contactsHtml = '<table class="data-table">';
  contactsHtml += '<tr><th>Name</th><th>Email</th><th>Message</th><th>Date</th></tr>';
  if (contacts.length === 0) {
    contactsHtml += '<tr><td colspan="4" style="text-align:center;">No messages yet</td></tr>';
  } else {
    contacts.forEach(contact => {
      contactsHtml += `<tr>
        <td>${contact.name}</td>
        <td>${contact.email}</td>
        <td>${contact.message.substring(0, 100)}${contact.message.length > 100 ? '...' : ''}</td>
        <td>${contact.date}</td>
      </tr>`;
    });
  }
  contactsHtml += '</table>';
  document.getElementById('contactsList').innerHTML = contactsHtml;
  
  // Build bookings table
  let bookingsHtml = '<table class="data-table">';
  bookingsHtml += '<tr><th>Date</th><th>Time</th><th>Booked On</th></tr>';
  if (bookings.length === 0) {
    bookingsHtml += '<tr><td colspan="3" style="text-align:center;">No bookings yet</td></tr>';
  } else {
    bookings.forEach(booking => {
      bookingsHtml += `<tr>
        <td>${booking.date}</td>
        <td>${booking.time}</td>
        <td>${booking.createdAt}</td>
      </tr>`;
    });
  }
  bookingsHtml += '</table>';
  document.getElementById('bookingsList').innerHTML = bookingsHtml;
}

function showTab(tabName) {
  // Hide all tabs
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  
  // Show selected tab
  if (tabName === 'orders') {
    document.getElementById('ordersTab').classList.add('active');
    document.querySelector('.tab-btn').classList.add('active');
  } else if (tabName === 'contacts') {
    document.getElementById('contactsTab').classList.add('active');
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
  } else if (tabName === 'bookings') {
    document.getElementById('bookingsTab').classList.add('active');
    document.querySelectorAll('.tab-btn')[2].classList.add('active');
  }
}
</script>
</body>
</html>
